services:
  postgres:
    image: postgres:16-alpine
    container_name: realworld_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1c0b1c9e-59c4-4c26-896f-d4a5795a2c9a
      POSTGRES_DB: realworld
    ports:
      - "54333:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
